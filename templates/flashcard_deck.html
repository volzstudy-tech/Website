{% extends "base.html" %}{% block title %}{{ deck.title }} · IGRIS{% endblock %}{% block content %}<a class="back" href="{{ url_for('flashcards') }}">← All decks</a><div class="pagehead"><div><div class="eyebrow">{{ deck.subject }}</div><h1>{{ deck.title }}</h1><p class="muted">Tap the card to reveal the answer. Use the arrows to practise recall.</p></div></div><section class="panel card-study"><div class="tiny" id="cardCount">Card 1 of {{ cards|length }}</div><button class="flashcard" id="flashcard" type="button"><span id="cardSide">QUESTION</span><strong id="cardText"></strong><small>Tap to flip</small></button><div class="timer-controls"><button class="btn ghost" id="prevCard" type="button">← Previous</button><button class="btn" id="flipCard" type="button">Reveal answer</button><button class="btn ghost" id="nextCard" type="button">Next →</button></div></section><script>const cards={{ cards|tojson }};let i=0,back=false;function render(){document.getElementById('cardCount').textContent=`Card ${i+1} of ${cards.length}`;document.getElementById('cardSide').textContent=back?'ANSWER':'QUESTION';document.getElementById('cardText').textContent=back?cards[i].back:cards[i].front;document.getElementById('flipCard').textContent=back?'Show question':'Reveal answer'}function flip(){back=!back;render()}document.getElementById('flashcard').onclick=flip;document.getElementById('flipCard').onclick=flip;document.getElementById('prevCard').onclick=()=>{i=(i+cards.length-1)%cards.length;back=false;render()};document.getElementById('nextCard').onclick=()=>{i=(i+1)%cards.length;back=false;render()};render();</script>{% endblock %}
